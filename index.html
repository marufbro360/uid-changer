<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>UID EDITING TOOL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>UID EDITING TOOL</header>

  <div class="container">
    <div class="section">
      <h2>Bytes File Editing</h2>
      <input type="file" id="bytesFile" accept=".bytes"/>
      <label for="bytesFile">Upload .bytes File</label>
      <p id="bytesOutput">Awaiting file...</p>
      <div id="bytesControls" class="controls" style="display:none"></div>
    </div>

    <div class="section">
      <h2>Meta File Editing</h2>
      <input type="file" id="metaFile" accept=".meta"/>
      <label for="metaFile">Upload .meta File</label>
      <p id="metaOutput">Awaiting file...</p>
      <div id="metaControls" class="controls" style="display:none"></div>
    </div>
  </div>

  <footer>© 2025 UID Editor — Cyber Edition</footer>

  <script src="script.js"></script>
</body>
</html>
